<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumer VC Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #0f1b2d;
    --navy-light: #162236;
    --navy-card: #1a2d47;
    --amber: #f59e0b;
    --amber-light: #fbbf24;
    --white: #f1f5f9;
    --gray: #94a3b8;
    --gray-dark: #64748b;
    --green: #10b981;
    --red: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--navy); color: var(--white); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* NAV */
  header { background: var(--navy-light); border-bottom: 1px solid rgba(245,158,11,0.2); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
  .header-inner { display: flex; align-items: center; gap: 32px; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 700; color: var(--amber); padding: 16px 0; white-space: nowrap; }
  nav { display: flex; gap: 0; }
  nav button { background: none; border: none; color: var(--gray); cursor: pointer; padding: 18px 16px; font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
  nav button:hover { color: var(--white); }
  nav button.active { color: var(--amber); border-bottom-color: var(--amber); }

  /* LAYOUT */
  main { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .section { display: none; }
  .section.active { display: block; }

  /* CARDS */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.15); border-radius: 12px; padding: 20px; }
  .stat-card .label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--amber); }
  .stat-card .sub { font-size: 13px; color: var(--gray); margin-top: 4px; }

  /* CHARTS */
  .charts-row { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 768px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.1); border-radius: 12px; padding: 20px; }
  .chart-card h3 { font-size: 14px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
  .chart-wrap { position: relative; }

  /* FILTERS */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .filters select, .filters input { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.2); color: var(--white); padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--amber); }
  .filters label { font-size: 13px; color: var(--gray); }
  .filter-group { display: flex; align-items: center; gap: 8px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(245,158,11,0.1); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: var(--navy-light); padding: 12px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); cursor: pointer; white-space: nowrap; user-select: none; }
  thead th:hover { color: var(--amber); }
  thead th .sort-icon { margin-left: 4px; opacity: 0.5; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--amber); }
  tbody tr { border-top: 1px solid rgba(255,255,255,0.05); transition: background 0.1s; }
  tbody tr:hover { background: rgba(245,158,11,0.05); }
  tbody td { padding: 11px 14px; vertical-align: top; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-cpg { background: rgba(16,185,129,0.15); color: #10b981; }
  .badge-tech { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge-seed { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-a { background: rgba(139,92,246,0.15); color: #a78bfa; }
  .badge-b { background: rgba(236,72,153,0.15); color: #f472b6; }
  .badge-c { background: rgba(239,68,68,0.15); color: #f87171; }
  .badge-pre { background: rgba(20,184,166,0.15); color: #2dd4bf; }
  .amount-col { font-weight: 600; color: var(--amber-light); white-space: nowrap; }
  .investors-list { color: var(--gray); font-size: 12px; }
  .lead-investor { color: var(--white); font-weight: 500; }
  .date-col { color: var(--gray); white-space: nowrap; }
  .no-data { text-align: center; padding: 40px; color: var(--gray); }

  /* TALKING POINTS */
  .week-label { font-size: 13px; color: var(--gray); margin-bottom: 20px; }
  .tp-grid { display: grid; gap: 16px; }
  .tp-card { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.1); border-radius: 12px; padding: 20px; border-left: 3px solid var(--amber); }
  .tp-card .tp-label { font-size: 13px; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .tp-card .tp-context { font-size: 14px; color: var(--white); line-height: 1.6; margin-bottom: 8px; }
  .tp-card .tp-take { font-size: 13px; color: var(--gray); line-height: 1.5; font-style: italic; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; margin-top: 8px; }
  .tp-take::before { content: '📌 '; }
  .deals-ref { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.1); border-radius: 12px; padding: 20px; margin-top: 20px; }
  .deals-ref h3 { font-size: 14px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .deals-ref-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .deals-ref-list span { background: rgba(245,158,11,0.1); color: var(--amber); padding: 4px 12px; border-radius: 20px; font-size: 13px; }

  /* INVESTOR TRACKER */
  .toggle-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .toggle-btn { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.2); color: var(--gray); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
  .toggle-btn.active { background: rgba(245,158,11,0.15); color: var(--amber); border-color: var(--amber); }
  .investor-grid { display: grid; gap: 12px; }
  .investor-card { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.1); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
  .investor-rank { font-size: 20px; font-weight: 700; color: var(--amber); min-width: 36px; }
  .investor-info { flex: 1; }
  .investor-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .investor-deals { font-size: 12px; color: var(--gray); }
  .investor-count { font-size: 24px; font-weight: 700; color: var(--amber); }
  .investor-count-label { font-size: 11px; color: var(--gray); text-align: center; }
  .disclaimer { font-size: 12px; color: var(--gray-dark); margin-top: 12px; font-style: italic; }

  /* FUND NEWS */
  .news-feed { display: grid; gap: 14px; }
  .news-card { background: var(--navy-card); border: 1px solid rgba(245,158,11,0.1); border-radius: 12px; padding: 18px 20px; }
  .news-card .news-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .news-card .fund-name { font-size: 15px; font-weight: 600; }
  .news-card .news-date { font-size: 12px; color: var(--gray); white-space: nowrap; }
  .news-card .news-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; display: inline-block; }
  .news-badge-fund { background: rgba(245,158,11,0.15); color: var(--amber); }
  .news-badge-hire { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .news-badge-lp { background: rgba(16,185,129,0.15); color: #10b981; }
  .news-badge-other { background: rgba(100,116,139,0.2); color: var(--gray); }
  .news-card .news-details { font-size: 13px; color: var(--gray); line-height: 1.6; }
  .news-card .news-source { font-size: 11px; color: var(--gray-dark); margin-top: 8px; }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .section-title { font-size: 20px; font-weight: 700; }

  /* FOOTER */
  footer { text-align: center; padding: 32px 24px; color: var(--gray-dark); font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 48px; }
  footer span { display: block; margin-top: 4px; }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; padding: 80px; flex-direction: column; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(245,158,11,0.2); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">⚡ Consumer VC</div>
    <nav id="nav">
      <button class="active" onclick="showSection('deals', this)">Latest Deals</button>
      <button onclick="showSection('talking', this)">This Week</button>
      <button onclick="showSection('investors', this)">Investors</button>
      <button onclick="showSection('news', this)">Fund News</button>
    </nav>
  </div>
</header>

<main>
  <div id="deals" class="section active">
    <div class="loading" id="deals-loading"><div class="spinner"></div><span style="color:var(--gray)">Loading deals…</span></div>
    <div id="deals-content" style="display:none">
      <div class="stat-row" id="stat-row"></div>
      <div class="charts-row">
        <div class="chart-card">
          <h3>By Sector (30d)</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="sectorChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>By Subsector (30d)</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="subsectorChart"></canvas></div>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="table-wrap">
        <table id="deals-table">
          <thead>
            <tr>
              <th onclick="sortTable('date')">Date <span class="sort-icon" id="sort-date">↓</span></th>
              <th onclick="sortTable('company')">Company <span class="sort-icon" id="sort-company">↕</span></th>
              <th onclick="sortTable('sector')">Sector <span class="sort-icon" id="sort-sector">↕</span></th>
              <th onclick="sortTable('subsector')">Subsector <span class="sort-icon" id="sort-subsector">↕</span></th>
              <th onclick="sortTable('series')">Stage <span class="sort-icon" id="sort-series">↕</span></th>
              <th onclick="sortTable('amountNum')">Amount <span class="sort-icon" id="sort-amountNum">↕</span></th>
              <th>Valuation</th>
              <th onclick="sortTable('leadInvestor')">Lead Investor <span class="sort-icon" id="sort-leadInvestor">↕</span></th>
              <th>All Investors</th>
            </tr>
          </thead>
          <tbody id="deals-tbody"></tbody>
        </table>
      </div>
      <div style="margin-top:10px; font-size:12px; color:var(--gray-dark)" id="table-count"></div>
    </div>
  </div>

  <div id="talking" class="section">
    <div class="loading" id="talking-loading"><div class="spinner"></div><span style="color:var(--gray)">Loading…</span></div>
    <div id="talking-content" style="display:none"></div>
  </div>

  <div id="investors" class="section">
    <div class="loading" id="investors-loading"><div class="spinner"></div><span style="color:var(--gray)">Loading…</span></div>
    <div id="investors-content" style="display:none"></div>
  </div>

  <div id="news" class="section">
    <div class="loading" id="news-loading"><div class="spinner"></div><span style="color:var(--gray)">Loading…</span></div>
    <div id="news-content" style="display:none"></div>
  </div>
</main>

<footer>
  Data sourced from subscribed newsletters. Not investment advice.
  <span id="footer-ts"></span>
</footer>

<script>
let DATA = null;
let currentSection = 'deals';
let sortCol = 'date';
let sortAsc = false;
let sectorChart = null;
let subsectorChart = null;

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  currentSection = id;
}

function daysSince(dateStr) {
  return (Date.now() - new Date(dateStr).getTime()) / 86400000;
}

function stageColor(series) {
  if (!series) return 'badge-pre';
  const s = series.toLowerCase();
  if (s.includes('pre-seed') || s.includes('pre seed')) return 'badge-pre';
  if (s.includes('seed')) return 'badge-seed';
  if (s.includes('series a')) return 'badge-a';
  if (s.includes('series b')) return 'badge-b';
  if (s.includes('series c') || s.includes('series d') || s.includes('series e')) return 'badge-c';
  if (s.includes('minority')) return 'badge-pre';
  if (s.includes('debt') || s.includes('credit') || s.includes('revenu')) return 'badge-pre';
  return 'badge-pre';
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// ---------- DEALS ----------
function buildDeals() {
  const deals = DATA.deals;

  // Filters
  const filterEl = document.getElementById('filters');
  filterEl.innerHTML = `
    <div class="filter-group"><label>Sector</label>
      <select id="f-sector" onchange="onSectorChange()">
        <option value="">All Sectors</option>
        <option value="CPG">CPG</option>
        <option value="Consumer Tech">Consumer Tech</option>
      </select>
    </div>
    <div class="filter-group"><label>Subsector</label>
      <select id="f-subsector" onchange="applyFilters()"></select>
    </div>
    <div class="filter-group"><label>Stage</label>
      <select id="f-stage" onchange="applyFilters()">
        <option value="">All Stages</option>
        <option>Pre-Seed</option><option>Seed</option>
        <option>Series A</option><option>Series B</option>
        <option>Series C</option><option>Minority Investment</option><option>Debt</option>
      </select>
    </div>
    <div class="filter-group"><label>Date Range</label>
      <select id="f-date" onchange="applyFilters()">
        <option value="30">Last 30 days</option>
        <option value="7">Last 7 days</option>
        <option value="90">Last 90 days</option>
        <option value="0">All time</option>
      </select>
    </div>`;

  populateSubsectors();
  buildCharts();
  buildStats();
  applyFilters();

  document.getElementById('deals-loading').style.display = 'none';
  document.getElementById('deals-content').style.display = 'block';
}

function onSectorChange() { populateSubsectors(); applyFilters(); }

function populateSubsectors() {
  const sector = document.getElementById('f-sector')?.value || '';
  const sub = document.getElementById('f-subsector');
  if (!sub) return;
  const cpgSubs = ['Food & Bev','Personal Care & Beauty','Pet','Home','Supplement & Wellness','Apparel','Other CPG'];
  const techSubs = ['Fintech & Payments','Healthcare & Wellness Tech','Social & Community','Hardware','Marketplace','AI-Native Consumer','Other Consumer Tech'];
  let opts = '<option value="">All Subsectors</option>';
  const list = sector === 'CPG' ? cpgSubs : sector === 'Consumer Tech' ? techSubs : [...cpgSubs, ...techSubs];
  list.forEach(s => opts += `<option>${s}</option>`);
  sub.innerHTML = opts;
}

function getFilteredDeals() {
  const sector = document.getElementById('f-sector')?.value || '';
  const subsector = document.getElementById('f-subsector')?.value || '';
  const stage = document.getElementById('f-stage')?.value || '';
  const days = parseInt(document.getElementById('f-date')?.value || '30');
  return DATA.deals.filter(d => {
    if (sector && d.sector !== sector) return false;
    if (subsector && d.subsector !== subsector) return false;
    if (stage && d.series !== stage) return false;
    if (days > 0 && daysSince(d.date) > days) return false;
    return true;
  });
}

function applyFilters() {
  let filtered = getFilteredDeals();
  filtered.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'date') { av = av || ''; bv = bv || ''; }
    if (sortCol === 'amountNum') { av = av != null ? av : -1; bv = bv != null ? bv : -1; }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('deals-tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="no-data">No deals found for these filters.</td></tr>';
    document.getElementById('table-count').textContent = '';
    return;
  }

  tbody.innerHTML = filtered.map(d => `
    <tr>
      <td class="date-col">${fmtDate(d.date)}</td>
      <td><strong>${d.company}</strong></td>
      <td><span class="badge ${d.sector === 'CPG' ? 'badge-cpg' : 'badge-tech'}">${d.sector || '—'}</span></td>
      <td style="color:var(--gray);font-size:12px">${d.subsector || '—'}</td>
      <td><span class="badge ${stageColor(d.series)}">${d.series || '—'}</span></td>
      <td class="amount-col">${d.amount || '—'}</td>
      <td style="color:var(--gray)">${d.valuation || '—'}</td>
      <td class="lead-investor">${d.leadInvestor || '—'}</td>
      <td class="investors-list">${(d.investors || []).join(', ') || '—'}</td>
    </tr>`).join('');

  document.getElementById('table-count').textContent = `Showing ${filtered.length} deals`;
}

function sortTable(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = col !== 'date' && col !== 'amountNum'; }
  document.querySelectorAll('thead th .sort-icon').forEach(el => {
    el.textContent = '↕'; el.parentElement.classList.remove('sorted');
  });
  const icon = document.getElementById('sort-' + col);
  if (icon) { icon.textContent = sortAsc ? '↑' : '↓'; icon.parentElement.classList.add('sorted'); }
  applyFilters();
}

function buildStats() {
  const last30 = DATA.deals.filter(d => daysSince(d.date) <= 30);
  const invCount = {};
  last30.forEach(d => (d.investors || []).forEach(inv => { invCount[inv] = (invCount[inv] || 0) + 1; }));
  const topInv = Object.entries(invCount).sort((a,b) => b[1]-a[1])[0] || ['—', 0];
  const subCount = {};
  last30.forEach(d => { if (d.subsector) subCount[d.subsector] = (subCount[d.subsector] || 0) + 1; });
  const topSub = Object.entries(subCount).sort((a,b) => b[1]-a[1])[0] || ['—', 0];

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card">
      <div class="label">Total Deals (30d)</div>
      <div class="value">${last30.length}</div>
      <div class="sub">across ${[...new Set(last30.map(d=>d.sector))].length} sectors</div>
    </div>
    <div class="stat-card">
      <div class="label">Most Active Investor (30d)</div>
      <div class="value" style="font-size:18px;line-height:1.3">${topInv[0]}</div>
      <div class="sub">${topInv[1]} deal${topInv[1] !== 1 ? 's' : ''}</div>
    </div>
    <div class="stat-card">
      <div class="label">Hottest Subsector (30d)</div>
      <div class="value" style="font-size:18px;line-height:1.3">${topSub[0]}</div>
      <div class="sub">${topSub[1]} deal${topSub[1] !== 1 ? 's' : ''}</div>
    </div>`;
}

function buildCharts() {
  const last30 = DATA.deals.filter(d => daysSince(d.date) <= 30);

  const sCount = {};
  last30.forEach(d => { sCount[d.sector] = (sCount[d.sector] || 0) + 1; });
  if (sectorChart) sectorChart.destroy();
  sectorChart = new Chart(document.getElementById('sectorChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(sCount),
      datasets: [{ data: Object.values(sCount), backgroundColor: ['#10b981','#3b82f6','#f59e0b','#a78bfa'], borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 12, padding: 12 } } } }
  });

  const subCount = {};
  last30.forEach(d => { if (d.subsector) subCount[d.subsector] = (subCount[d.subsector] || 0) + 1; });
  const sorted = Object.entries(subCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if (subsectorChart) subsectorChart.destroy();
  subsectorChart = new Chart(document.getElementById('subsectorChart'), {
    type: 'bar',
    data: {
      labels: sorted.map(e=>e[0]),
      datasets: [{ data: sorted.map(e=>e[1]), backgroundColor: '#f59e0b88', borderColor: '#f59e0b', borderWidth: 1, borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

// ---------- TALKING POINTS ----------
function buildTalking() {
  const tp = DATA.weeklyTalkingPoints || {};
  const points = tp.points || [];
  const refs = tp.dealsReferenced || [];
  const el = document.getElementById('talking-content');
  el.innerHTML = `
    <div class="section-header"><div class="section-title">This Week in Consumer VC</div></div>
    <div class="week-label">Week of ${tp.weekOf || '—'} · Generated ${tp.generatedAt || '—'}</div>
    <div class="tp-grid">
      ${points.map(p => `
        <div class="tp-card">
          <div class="tp-label">${p.label || ''}</div>
          <div class="tp-context">${p.context || ''}</div>
          <div class="tp-take">${p.take || ''}</div>
        </div>`).join('')}
    </div>
    ${refs.length ? `
    <div class="deals-ref">
      <h3>Deals Referenced This Week</h3>
      <div class="deals-ref-list">${refs.map(r => `<span>${r}</span>`).join('')}</div>
    </div>` : ''}`;
  document.getElementById('talking-loading').style.display = 'none';
  el.style.display = 'block';
}

// ---------- INVESTORS ----------
let investorView = 'fund';

function buildInvestors() {
  const el = document.getElementById('investors-content');
  el.innerHTML = `
    <div class="section-header"><div class="section-title">Investor Activity Tracker</div></div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-fund" onclick="switchInvestorView('fund')">By Fund</button>
      <button class="toggle-btn" id="btn-partner" onclick="switchInvestorView('partner')">By Partner</button>
    </div>
    <div id="investor-list"></div>
    <div class="disclaimer">Frequency reflects newsletter coverage, not verified investment data.</div>`;
  document.getElementById('investors-loading').style.display = 'none';
  el.style.display = 'block';
  renderInvestorList();
}

function switchInvestorView(view) {
  investorView = view;
  document.getElementById('btn-fund').classList.toggle('active', view === 'fund');
  document.getElementById('btn-partner').classList.toggle('active', view === 'partner');
  renderInvestorList();
}

function renderInvestorList() {
  const cutoff = Date.now() - 90 * 86400000;
  const recent = DATA.investorActivity.filter(r => new Date(r.date).getTime() >= cutoff);
  const counts = {};
  const dealMap = {};
  recent.forEach(r => {
    const key = investorView === 'partner' ? (r.partner || r.fund) : r.fund;
    if (!key || key === '') return;
    counts[key] = (counts[key] || 0) + 1;
    dealMap[key] = [...new Set([...(dealMap[key] || []), ...(r.deals || [])])];
  });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20);
  document.getElementById('investor-list').innerHTML = `
    <div class="investor-grid">
      ${sorted.map(([name, count], i) => `
        <div class="investor-card">
          <div class="investor-rank">${i+1}</div>
          <div class="investor-info">
            <div class="investor-name">${name}</div>
            <div class="investor-deals">${(dealMap[name]||[]).slice(0,5).join(', ')}${(dealMap[name]||[]).length > 5 ? ' +more' : ''}</div>
          </div>
          <div style="text-align:center">
            <div class="investor-count">${count}</div>
            <div class="investor-count-label">appearances</div>
          </div>
        </div>`).join('')}
    </div>`;
}

// ---------- FUND NEWS ----------
function buildNews() {
  const el = document.getElementById('news-content');
  el.innerHTML = `
    <div class="section-header">
      <div class="section-title">Fund-Level News</div>
      <div class="filters">
        <select onchange="renderNews(this.value)">
          <option value="">All Types</option>
          <option value="New Fund">New Fund</option>
          <option value="LP Close">LP Close</option>
          <option value="New Partner Hire">New Partner Hire</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div id="news-list"></div>`;
  document.getElementById('news-loading').style.display = 'none';
  el.style.display = 'block';
  renderNews('');
}

function badgeClass(type) {
  if (type === 'New Fund') return 'news-badge-fund';
  if (type === 'New Partner Hire') return 'news-badge-hire';
  if (type === 'LP Close') return 'news-badge-lp';
  return 'news-badge-other';
}

function renderNews(filter) {
  const cutoff = Date.now() - 90 * 86400000;
  let items = DATA.fundNews.filter(n => new Date(n.date).getTime() >= cutoff);
  if (filter) items = items.filter(n => n.newsType === filter);
  items.sort((a,b) => new Date(b.date) - new Date(a.date));
  document.getElementById('news-list').innerHTML = items.length ? `
    <div class="news-feed">
      ${items.map(n => `
        <div class="news-card">
          <div class="news-header">
            <div class="fund-name">${n.fund}</div>
            <div class="news-date">${fmtDate(n.date)}</div>
          </div>
          <span class="news-badge ${badgeClass(n.newsType)}">${n.newsType}</span>
          <div class="news-details">${n.details}</div>
          <div class="news-source">Source: ${n.source || '—'}</div>
        </div>`).join('')}
    </div>` : '<div class="no-data">No fund news found.</div>';
}

// ---------- INIT ----------
async function init() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    DATA = await res.json();
    const ts = new Date(DATA.lastUpdated);
    document.getElementById('footer-ts').textContent = 'Last updated: ' + ts.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    buildDeals();
    buildTalking();
    buildInvestors();
    buildNews();
  } catch(e) {
    document.querySelectorAll('.loading').forEach(el => {
      el.innerHTML = '<div style="color:#ef4444">Error loading data. Make sure data.json is in the same directory.</div>';
    });
    console.error(e);
  }
}

init();
</script>
</body>
</html>
